# What each headless agent may run without a permission prompt (--allowedTools), one line per agent:
#   <agent>: <entry>, <entry>, ...      (comma separated: an entry may contain spaces, like Bash(gh issue view:*))
# A script path written as ~/... is also allowed in its expanded form (the agents call the scripts through a variable,
# and the permission check only matches the expanded home path then; verified with real probes). Anything else is denied; the agent reports it and the no-progress guard of orchestrate.sh parks the issue.
# Optional model per agent: "model-<agent>: <alias>" (passed as --model); no line = default model. Simple agents get a cheaper one.
# Start narrow and widen here. Credential-level limits are the subject of issue #9.
# NOTE: no agent may run an interpreter (bash, zsh, sh): `bash -c '<anything>'` would get around the list. The unit tests run
# through the literal path of run-unit-tests.sh (coder: the checkout; reviewer and tester: the driver adds the review
# worktree root as Bash(<root>/*) at run time, so the script of the pull request runs). A single test file is not allowed
# separately (see the orchestrate skill); the whole suite is fast. The list limits which commands run without a prompt;
# it is not a sandbox: the allowed tools (git, gh, jq, scripts) still act with the user's credentials (the rest is #9).
# just recipes (repos run by just, such as alertcopy): only check, test, lint, typecheck and setup recipes; the coder also
# the -fix recipes and be-openapi. Never infra-*, bump, clean or release recipes (cloud changes, commits, deletions).
# The coder may delete or move tracked files with git rm and git mv only (recoverable from git history), never with rm or mv.
model-triager: haiku
model-tester: haiku
triager: Read, Grep, Glob, Skill, Bash(~/.claude/skills/project-board/scripts/board.sh:*), Bash(~/.claude/skills/project-board/scripts/blockers.sh:*), Bash(~/.claude/skills/prioritize/scripts/queue.sh:*), Bash(gh issue view:*), Bash(gh issue list:*), Bash(gh issue comment:*), Bash(gh issue edit:*), Bash(gh label create:*), Bash(git log:*), Bash(git status:*)
coder: Read, Edit, Write, Grep, Glob, Skill, Bash(~/.claude/skills/project-board/scripts/board.sh:*), Bash(~/.claude/skills/prioritize/scripts/queue.sh:*), Bash(~/.claude/skills/project-board/scripts/run-unit-tests.sh:*), Bash(~/.claude/skills/code-issue/scripts/commit-push.sh:*), Bash(~/.claude/skills/code-issue/scripts/pr-feedback.sh:*), Bash(~/.claude/skills/code-issue/scripts/with-https.sh:*), Bash(gh issue view:*), Bash(gh issue edit:*), Bash(gh issue comment:*), Bash(gh issue create:*), Bash(gh label create:*), Bash(gh pr create:*), Bash(gh pr view:*), Bash(gh pr comment:*), Bash(git status:*), Bash(git diff:*), Bash(git log:*), Bash(git branch:*), Bash(git checkout:*), Bash(git rm:*), Bash(git mv:*), Bash(shellcheck:*), Bash(jq:*), Bash(just check:*), Bash(just test:*), Bash(just be-test:*), Bash(just be-test-e2e:*), Bash(just lint:*), Bash(just be-lint:*), Bash(just typecheck:*), Bash(just be-typecheck:*), Bash(just setup:*), Bash(just be-setup:*), Bash(just js-setup:*), Bash(just lint-fix:*), Bash(just be-lint-fix:*), Bash(just be-openapi:*)
reviewer: Read, Grep, Glob, Skill, Bash(~/.claude/skills/project-board/scripts/board.sh:*), Bash(~/.claude/skills/prioritize/scripts/queue.sh:*), Bash(~/.claude/skills/project-board/scripts/run-unit-tests.sh:*), Bash(~/.claude/skills/review/scripts/review-state.sh:*), Bash(~/.claude/skills/review/scripts/post-review.sh:*), Bash(~/.claude/skills/review/scripts/review-worktree.sh:*), Bash(~/.claude/skills/code-issue/scripts/with-https.sh:*), Bash(gh issue view:*), Bash(gh issue comment:*), Bash(gh issue edit:*), Bash(gh label create:*), Bash(gh pr view:*), Bash(git diff:*), Bash(git log:*), Bash(git show:*), Bash(git rev-parse:*), Bash(git -C:*), Bash(shellcheck:*), Bash(jq:*), Bash(just check:*), Bash(just test:*), Bash(just be-test:*), Bash(just be-test-e2e:*), Bash(just lint:*), Bash(just be-lint:*), Bash(just typecheck:*), Bash(just be-typecheck:*), Bash(just setup:*), Bash(just be-setup:*), Bash(just js-setup:*)
