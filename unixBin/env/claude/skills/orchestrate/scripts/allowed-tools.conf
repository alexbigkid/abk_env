# What each headless agent may run without a permission prompt (--allowedTools), one line per agent:
#   <agent>: <entry>, <entry>, ...      (comma separated: an entry may contain spaces, like Bash(gh issue view:*))
# A script path written as ~/... is also allowed in its expanded form (the agents call the scripts through a variable,
# and the permission check only matches the expanded home path then; verified with real probes). Anything else is denied; the agent reports it and the no-progress guard of orchestrate.sh parks the issue.
# Optional model per agent: "model-<agent>: <alias>" (passed as --model); no line = default model. Simple agents get a cheaper one.
# Start narrow and widen here. Credential-level limits are the subject of issue #9.
# NOTE: this is a first layer, not a sandbox. Bash(bash:*) and Bash(zsh:*) are there so that the agents can run the
# repo's test scripts, and they also allow `bash -c '<anything>'`. Replace them by the test commands of your repo
# (for example Bash(./test_install.sh:*)) to make the list a real boundary; the rest of the hardening is #9.
model-triager: haiku
model-tester: haiku
triager: Read, Grep, Glob, Skill, Bash(~/.claude/skills/project-board/scripts/board.sh:*), Bash(~/.claude/skills/project-board/scripts/blockers.sh:*), Bash(~/.claude/skills/prioritize/scripts/queue.sh:*), Bash(gh issue view:*), Bash(gh issue list:*), Bash(gh issue comment:*), Bash(gh issue edit:*), Bash(gh label create:*), Bash(git log:*), Bash(git status:*)
coder: Read, Edit, Write, Grep, Glob, Skill, Bash(~/.claude/skills/project-board/scripts/board.sh:*), Bash(~/.claude/skills/prioritize/scripts/queue.sh:*), Bash(~/.claude/skills/code-issue/scripts/commit-push.sh:*), Bash(~/.claude/skills/code-issue/scripts/pr-feedback.sh:*), Bash(~/.claude/skills/code-issue/scripts/with-https.sh:*), Bash(gh issue view:*), Bash(gh issue edit:*), Bash(gh issue comment:*), Bash(gh issue create:*), Bash(gh label create:*), Bash(gh pr create:*), Bash(gh pr view:*), Bash(gh pr comment:*), Bash(git status:*), Bash(git diff:*), Bash(git log:*), Bash(git branch:*), Bash(git checkout:*), Bash(bash:*), Bash(zsh:*), Bash(shellcheck:*), Bash(jq:*)
reviewer: Read, Grep, Glob, Skill, Bash(~/.claude/skills/project-board/scripts/board.sh:*), Bash(~/.claude/skills/prioritize/scripts/queue.sh:*), Bash(~/.claude/skills/review/scripts/review-state.sh:*), Bash(~/.claude/skills/review/scripts/post-review.sh:*), Bash(~/.claude/skills/review/scripts/review-worktree.sh:*), Bash(~/.claude/skills/code-issue/scripts/with-https.sh:*), Bash(gh issue view:*), Bash(gh issue comment:*), Bash(gh issue edit:*), Bash(gh label create:*), Bash(gh pr view:*), Bash(git diff:*), Bash(git log:*), Bash(git show:*), Bash(git rev-parse:*), Bash(git -C:*), Bash(bash:*), Bash(zsh:*), Bash(shellcheck:*), Bash(jq:*)
tester: Read, Grep, Glob, Skill, Bash(~/.claude/skills/project-board/scripts/board.sh:*), Bash(~/.claude/skills/prioritize/scripts/queue.sh:*), Bash(~/.claude/skills/review/scripts/review-state.sh:*), Bash(~/.claude/skills/review/scripts/review-worktree.sh:*), Bash(~/.claude/skills/test-issue/scripts/merge-pr.sh:*), Bash(~/.claude/skills/code-issue/scripts/with-https.sh:*), Bash(gh issue view:*), Bash(gh issue comment:*), Bash(gh issue edit:*), Bash(gh issue reopen:*), Bash(gh label create:*), Bash(gh pr view:*), Bash(git diff:*), Bash(git log:*), Bash(git rev-parse:*), Bash(git -C:*), Bash(bash:*), Bash(zsh:*), Bash(shellcheck:*), Bash(jq:*)
