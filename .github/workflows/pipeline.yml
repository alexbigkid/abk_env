name: abk_env
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

# Prevent duplicate runs - prioritize by commit SHA
concurrency:
    group: ${{ github.workflow }}-${{ github.sha }}
    cancel-in-progress: true

env:
    ENV: prod

jobs:
    MacOS:
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
        name: MacOS ${{ matrix.version }}
        runs-on: macos-${{ matrix.version }}
        strategy:
            fail-fast: false
            matrix:
                # macos-27 removed: no GitHub-hosted runner yet, job stays queued for 24h and blocks releases.
                # Add 27 back once runs-on: macos-27 is available.
                version: [15, 26]
        steps:
            - name: checkout repo
              uses: actions/checkout@v6

            - name: Check runner
              run: .github/scripts/AgentInfo.sh

            - name: Ensure correct SHELL availability
              run: |
                echo "--------Shells----------------------"
                cat /etc/shells
                echo "-------MacOS SW version-------------"
                sw_vers

            # The runner image ships ruby@3.3; the "brew upgrade" of the install flow upgrades it and
            # its "brew link" fails on files of the old version. Upgrade it first and link with overwrite.
            - name: Upgrade pre-installed ruby@3.3 and relink
              run: |
                brew update
                if brew list --formula ruby@3.3 >/dev/null 2>&1; then
                    brew upgrade ruby@3.3 || true
                    brew link --overwrite --force ruby@3.3
                fi

            - name: zsh install tools
              shell: zsh {0}
              run: |
                export SHELL=$(which zsh)
                echo "SHELL = $SHELL"
                ./test_install.sh "tools_"

            - name: zsh uninstall tools
              shell: zsh {0}
              run: |
                export SHELL=$(which zsh)
                echo "SHELL = $SHELL"
                ./test_uninstall.sh "tools_"

            - name: bash install tools
              shell: bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                ./test_install.sh "tools_"

            - name: bash uninstall tools
              shell: bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                ./test_uninstall.sh "tools_"

            - name: skill script tests (all test_*.sh, every shell found)
              shell: bash {0}
              run: |
                command -v gpg >/dev/null || brew install gnupg
                ./unixBin/env/claude/skills/project-board/scripts/run-unit-tests.sh

    Ubuntu:
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
        name: Ubuntu ${{ matrix.version }}
        runs-on: ubuntu-${{ matrix.version }}
        strategy:
            fail-fast: false
            matrix:
                version: [22.04, 24.04, 26.04]
        steps:
            - name: checkout repo
              uses: actions/checkout@v6

            - name: Check runner
              run: .github/scripts/AgentInfo.sh

            - name: Ensure zsh is installed
              run: |
                SHELL_CMD="zsh"
                echo "Checking if $SHELL_CMD is installed..."
                if ! command -v "$SHELL_CMD" &> /dev/null; then
                    echo "$SHELL_CMD not found, attempting to install..."
                    sudo apt-get update
                    sudo apt-get install -y "$SHELL_CMD"
                    echo "$SHELL_CMD just installed."
                else
                    echo "$SHELL_CMD is already installed."
                fi
                echo "--------Shells----------------------"
                cat /etc/shells
                echo "--------Linux os-release------------"
                cat /etc/os-release

            - name: zsh install tools
              shell: zsh {0}
              run: |
                export SHELL=$(which zsh)
                echo "SHELL = $SHELL"
                ./test_install.sh "tools_"

            - name: zsh uninstall tools
              shell: zsh {0}
              run: |
                export SHELL=$(which zsh)
                echo "SHELL = $SHELL"
                ./test_uninstall.sh "tools_"

            - name: bash install tools
              shell: bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                ./test_install.sh "tools_"

            - name: bash uninstall tools
              shell: bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                ./test_uninstall.sh "tools_"

            - name: skill script tests (all test_*.sh, every shell found)
              shell: bash {0}
              run: |
                command -v gpg >/dev/null || sudo apt-get install -y gnupg
                ./unixBin/env/claude/skills/project-board/scripts/run-unit-tests.sh

    WSL:
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
        name: WSL Ubuntu ${{ matrix.version }}
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                version: [22.04, 24.04, 26.04]
        steps:
            - name: checkout repo
              uses: actions/checkout@v6

            - name: Setup WSL
              uses: Vampire/setup-wsl@v7
              with:
                distribution: Ubuntu-${{ matrix.version }}
                wsl-version: 2
                additional-packages: curl git bash

            - name: Check WSL environment
              shell: wsl-bash {0}
              run: |
                echo "--------WSL Environment-----------"
                uname -a
                cat /etc/os-release
                echo "--------WSL Version-----------------"
                cat /proc/version | grep -i microsoft
                echo "--------Shells----------------------"
                cat /etc/shells

            - name: Prepare WSL environment
              shell: wsl-bash {0}
              run: |
                sudo apt update
                sudo apt install -y bash gnupg
                echo "--------Available tools after install-------"
                which bash || echo "bash not found"
                bash --version || echo "bash version check failed"
                echo "--------Setting execute permissions-------"
                chmod +x ./test_install.sh ./test_uninstall.sh ./unixBin/*.sh ./unixBin/env/claude/skills/*/scripts/*.sh

            - name: bash install tools (WSL)
              shell: wsl-bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                /bin/bash ./test_install.sh "wsl"

            - name: bash uninstall tools (WSL)
              shell: wsl-bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                /bin/bash ./test_uninstall.sh "wsl"

            - name: skill script tests (all test_*.sh, every shell found, WSL)
              shell: wsl-bash {0}
              run: |
                ./unixBin/env/claude/skills/project-board/scripts/run-unit-tests.sh
