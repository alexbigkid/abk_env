name: abk_env
on:
    # Only main, the release tags and manual runs: a feature branch pull request starts no run.
    # git rel-patch|minor|major pushes the tag rel-<type> on the HEAD of main; its run cancels the
    # run of the push to main (same commit, see concurrency), so the tests run once per release.
    push:
        branches:
            - main
        tags:
            - rel-patch
            - rel-minor
            - rel-major
    workflow_dispatch:
        inputs:
            fail_job:
                description: "Make one job fail on purpose to check cancel-on-first-failure"
                type: choice
                options: [none, macos, ubuntu, wsl]
                default: none

# actions: write lets a failed job cancel the whole run; contents: write lets it delete the rel-* tag first
permissions:
    contents: write
    actions: write

# Prevent duplicate runs - prioritize by commit SHA
concurrency:
    group: ${{ github.workflow }}-${{ github.sha }}
    cancel-in-progress: true

env:
    ENV: prod

jobs:
    MacOS:
        name: MacOS ${{ matrix.version }}
        # macOS 27 runs on the label xcode-27 (arm64); 26 keeps macos-<version>.
        runs-on: ${{ matrix.version == 27 && 'xcode-27' || format('macos-{0}', matrix.version) }}
        # Limits the work only; a job queued for a missing runner is not limited by it.
        timeout-minutes: 60
        strategy:
            matrix:
                # macOS 27 is switched by the repository variable MACOS_27_ENABLED=true (Settings > Variables).
                # Unset or any other value: 27 is not in the matrix, so a missing or slow runner never blocks a release.
                version: ${{ fromJSON(vars.MACOS_27_ENABLED == 'true' && '[26, 27]' || '[26]') }}
        steps:
            - name: Fail on purpose (manual check)
              if: github.event_name == 'workflow_dispatch' && inputs.fail_job == 'macos'
              run: |
                echo "fail_job=macos: failing on purpose"
                exit 1

            - name: checkout repo
              uses: actions/checkout@v6

            - name: Check runner
              run: .github/scripts/AgentInfo.sh

            - name: Ensure correct SHELL availability
              run: |
                echo "--------Shells----------------------"
                cat /etc/shells
                echo "-------MacOS SW version-------------"
                sw_vers

            # The runner image ships ruby@3.3; the "brew upgrade" of the install flow upgrades it and
            # its "brew link" fails on files of the old version. This is only a warning and NOT the cause
            # of a failed install (see #38); upgrading first and linking with overwrite keeps the logs clean.
            - name: Upgrade pre-installed ruby@3.3 and relink
              run: |
                if brew list --formula ruby@3.3 >/dev/null 2>&1; then
                    brew upgrade ruby@3.3 || echo "::warning::ruby@3.3 upgrade reported an error; relinking"
                    brew link --overwrite --force ruby@3.3
                fi

            - name: zsh install tools
              shell: zsh {0}
              run: |
                export SHELL=$(which zsh)
                echo "SHELL = $SHELL"
                ./test_install.sh "tools_"

            - name: zsh uninstall tools
              shell: zsh {0}
              run: |
                export SHELL=$(which zsh)
                echo "SHELL = $SHELL"
                ./test_uninstall.sh "tools_"

            - name: bash install tools
              shell: bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                ./test_install.sh "tools_"

            - name: bash uninstall tools
              shell: bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                ./test_uninstall.sh "tools_"

            - name: skill script tests (all test_*.sh, every shell found)
              shell: bash {0}
              run: |
                command -v gpg >/dev/null || brew install gnupg
                ./unixBin/env/claude/skills/project-board/scripts/run-unit-tests.sh

            - name: Cancel the whole run
              if: failure()
              env:
                GH_TOKEN: ${{ github.token }}
                GH_REPO: ${{ github.repository }}
              run: |
                # Release job is skipped when the run is cancelled: delete the rel-* tag here first.
                case "$GITHUB_REF" in
                    refs/tags/rel-*) gh api -X DELETE "repos/$GH_REPO/git/refs/tags/${GITHUB_REF#refs/tags/}" || true ;;
                esac
                gh run cancel ${{ github.run_id }}

    Ubuntu:
        name: Ubuntu ${{ matrix.version }}
        runs-on: ubuntu-${{ matrix.version }}
        strategy:
            matrix:
                version: [22.04, 24.04, 26.04]
        steps:
            - name: Fail on purpose (manual check)
              if: github.event_name == 'workflow_dispatch' && inputs.fail_job == 'ubuntu'
              run: |
                echo "fail_job=ubuntu: failing on purpose"
                exit 1

            - name: checkout repo
              uses: actions/checkout@v6

            - name: Check runner
              run: .github/scripts/AgentInfo.sh

            - name: Ensure zsh is installed
              run: |
                SHELL_CMD="zsh"
                echo "Checking if $SHELL_CMD is installed..."
                if ! command -v "$SHELL_CMD" &> /dev/null; then
                    echo "$SHELL_CMD not found, attempting to install..."
                    sudo apt-get update
                    sudo apt-get install -y "$SHELL_CMD"
                    echo "$SHELL_CMD just installed."
                else
                    echo "$SHELL_CMD is already installed."
                fi
                echo "--------Shells----------------------"
                cat /etc/shells
                echo "--------Linux os-release------------"
                cat /etc/os-release

            - name: zsh install tools
              shell: zsh {0}
              run: |
                export SHELL=$(which zsh)
                echo "SHELL = $SHELL"
                ./test_install.sh "tools_"

            - name: zsh uninstall tools
              shell: zsh {0}
              run: |
                export SHELL=$(which zsh)
                echo "SHELL = $SHELL"
                ./test_uninstall.sh "tools_"

            - name: bash install tools
              shell: bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                ./test_install.sh "tools_"

            - name: bash uninstall tools
              shell: bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                ./test_uninstall.sh "tools_"

            - name: skill script tests (all test_*.sh, every shell found)
              shell: bash {0}
              run: |
                command -v gpg >/dev/null || sudo apt-get install -y gnupg
                ./unixBin/env/claude/skills/project-board/scripts/run-unit-tests.sh

            - name: Cancel the whole run
              if: failure()
              env:
                GH_TOKEN: ${{ github.token }}
                GH_REPO: ${{ github.repository }}
              run: |
                # Release job is skipped when the run is cancelled: delete the rel-* tag here first.
                case "$GITHUB_REF" in
                    refs/tags/rel-*) gh api -X DELETE "repos/$GH_REPO/git/refs/tags/${GITHUB_REF#refs/tags/}" || true ;;
                esac
                gh run cancel ${{ github.run_id }}

    WSL:
        name: WSL Ubuntu ${{ matrix.version }}
        runs-on: windows-latest
        strategy:
            matrix:
                version: [22.04, 24.04, 26.04]
        steps:
            - name: Fail on purpose (manual check)
              if: github.event_name == 'workflow_dispatch' && inputs.fail_job == 'wsl'
              shell: bash
              run: |
                echo "fail_job=wsl: failing on purpose"
                exit 1

            - name: checkout repo
              uses: actions/checkout@v6

            - name: Setup WSL
              uses: Vampire/setup-wsl@v7
              with:
                distribution: Ubuntu-${{ matrix.version }}
                wsl-version: 2
                additional-packages: curl git bash

            - name: Check WSL environment
              shell: wsl-bash {0}
              run: |
                echo "--------WSL Environment-----------"
                uname -a
                cat /etc/os-release
                echo "--------WSL Version-----------------"
                cat /proc/version | grep -i microsoft
                echo "--------Shells----------------------"
                cat /etc/shells

            - name: Prepare WSL environment
              shell: wsl-bash {0}
              run: |
                sudo apt update
                sudo apt install -y bash gnupg
                echo "--------Available tools after install-------"
                which bash || echo "bash not found"
                bash --version || echo "bash version check failed"
                echo "--------Setting execute permissions-------"
                chmod +x ./test_install.sh ./test_uninstall.sh ./unixBin/*.sh ./unixBin/env/claude/skills/*/scripts/*.sh

            - name: bash install tools (WSL)
              shell: wsl-bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                /bin/bash ./test_install.sh "wsl"

            - name: bash uninstall tools (WSL)
              shell: wsl-bash {0}
              run: |
                export SHELL=$(which bash)
                echo "SHELL = $SHELL"
                /bin/bash ./test_uninstall.sh "wsl"

            - name: skill script tests (all test_*.sh, every shell found, WSL)
              shell: wsl-bash {0}
              run: |
                ./unixBin/env/claude/skills/project-board/scripts/run-unit-tests.sh

            - name: Cancel the whole run
              if: failure()
              shell: bash
              env:
                GH_TOKEN: ${{ github.token }}
                GH_REPO: ${{ github.repository }}
              run: |
                # Release job is skipped when the run is cancelled: delete the rel-* tag here first.
                case "$GITHUB_REF" in
                    refs/tags/rel-*) gh api -X DELETE "repos/$GH_REPO/git/refs/tags/${GITHUB_REF#refs/tags/}" || true ;;
                esac
                gh run cancel ${{ github.run_id }}

    # Only for a rel-* tag. Runs when the matrix ended (passed, failed or cancelled) and cleans up.
    Release:
        name: Release
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/rel-') }}
        needs: [MacOS, Ubuntu, WSL]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: checkout repo
              uses: actions/checkout@v6
              with:
                fetch-depth: 0

            - name: bump VERSION through a pull request, merge, tag
              env:
                GH_TOKEN: ${{ github.token }}
                GH_REPO: ${{ github.repository }}
                RESULT: ${{ needs.MacOS.result == 'success' && needs.Ubuntu.result == 'success' && needs.WSL.result == 'success' && 'pass' || 'fail' }}
              run: bash .github/scripts/release.sh "$RESULT"
