name: release-tag
# Creates the tag vX.Y.Z on a push to main whose commit changed VERSION (the merge commit of a release pull request).
# It tags only when VERSION changed and the tag does not exist yet, so it cannot loop or tag twice.
on:
    push:
        branches:
            - main

permissions:
    contents: write  # to push the tag

jobs:
    tag:
        name: Tag release
        runs-on: ubuntu-latest
        steps:
            - name: checkout pushed commit
              uses: actions/checkout@v6
              with:
                fetch-depth: 2

            - name: create tag when VERSION changed
              run: |
                if ! git diff --name-only HEAD^ HEAD | grep -qx VERSION; then
                    echo "VERSION not changed by this push, no tag"
                    exit 0
                fi
                TAG="v$(cat VERSION)"
                if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
                    echo "$TAG exists already, no tag"
                    exit 0
                fi
                git tag "$TAG"
                git push origin "$TAG"
                echo "created $TAG"
