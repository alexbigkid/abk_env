name: release-tag
# Creates the tag vX.Y.Z on the merge commit of a merged release pull request (branch release/**).
# It only runs for such a pull request and only tags when the merge changed VERSION, so it cannot loop.
on:
    pull_request:
        types: [closed]
        branches:
            - main

permissions:
    contents: write  # to push the tag

jobs:
    tag:
        name: Tag release
        runs-on: ubuntu-latest
        if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
        steps:
            - name: checkout merge commit
              uses: actions/checkout@v6
              with:
                ref: ${{ github.event.pull_request.merge_commit_sha }}
                fetch-depth: 2

            - name: create tag when VERSION changed
              run: |
                if ! git diff --name-only HEAD^ HEAD | grep -qx VERSION; then
                    echo "VERSION not changed by this merge, no tag"
                    exit 0
                fi
                TAG="v$(cat VERSION)"
                git tag "$TAG"
                git push origin "$TAG"
                echo "created $TAG"
